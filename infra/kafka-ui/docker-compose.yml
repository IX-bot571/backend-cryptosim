services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cryptosim-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - cryptosim-net

networks:
  cryptosim-net:
    external: true
